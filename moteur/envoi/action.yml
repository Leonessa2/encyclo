# Moteur commun — fichier : moteur/envoi/action.yml   (version 0.4.0)
#
# ENVOYER UN SITE CONSTRUIT AU VPS. Action appelée par le workflow de chaque
# site, après sa construction, avec ses propres réglages (rien ici n'est propre
# à un site). Ce qu'elle fait, dans l'ordre :
#   1. vérifie que tous les réglages sont là (sinon : échec clair, rien envoyé) ;
#   2. pose /version.txt (commit + heure) dans le site, pour la vérification ;
#   3. envoie le site dans versions/<date>-<commit>/ (rsync par SSH ; les
#      fichiers inchangés depuis la version en ligne ne sont pas recopiés) ;
#   4. bascule le lien `courant` vers cette version, d'un coup (le serveur web
#      sert toujours `courant`) ;
#   5. vérifie la page réellement servie : /version.txt à l'adresse donnée doit
#      porter ce commit. Sinon : remet le lien sur la version d'avant, et échoue ;
#   6. garde les <garder> dernières versions, efface les plus anciennes.
#
# ⛔ Sur le VPS, la clé d'envoi est limitée par une COMMANDE FORCÉE au script
#    moteur/envoi/serveur/recevoir-site.sh, qui fixe le dossier du site et ne
#    sait faire que les étapes 3 à 6. Voir moteur/envoi/LISEZMOI.md.

name: Envoyer le site au VPS
description: Envoie un site statique construit au VPS, bascule d'un coup, vérifie, garde les versions précédentes.

inputs:
  site-construit:
    description: Dossier du site construit, sur la machine de GitHub
    default: dist
  hote:
    description: Nom ou adresse du VPS
    required: true
  port:
    description: Port SSH du VPS
    default: '22'
  utilisateur:
    description: Compte SSH réservé aux envois
    required: true
  cle:
    description: Clé privée SSH du compte d'envoi (un secret, jamais en clair)
    required: true
  empreinte:
    description: Ligne known_hosts du VPS (vérifie qu'on parle au bon serveur)
    required: true
  adresse:
    description: Adresse publique où vérifier le site envoyé (https://…, sans / final)
    required: true
  garder:
    description: Nombre de versions gardées sur le VPS
    default: '5'

runs:
  using: composite
  steps:
    - name: Vérifier les réglages
      shell: bash
      env:
        HOTE: ${{ inputs.hote }}
        UTIL: ${{ inputs.utilisateur }}
        CLE: ${{ inputs.cle }}
        EMPREINTE: ${{ inputs.empreinte }}
        ADRESSE: ${{ inputs.adresse }}
        SITE_CONSTRUIT: ${{ inputs.site-construit }}
        GARDER: ${{ inputs.garder }}
      run: |
        set -eu
        manque=""
        for v in HOTE UTIL CLE EMPREINTE ADRESSE; do
          [ -n "${!v}" ] || manque="$manque $v"
        done
        [ -z "$manque" ] || { echo "::error title=Envoi impossible::réglage(s) absent(s) :$manque. Rien n'a été envoyé."; exit 1; }
        case "$ADRESSE" in https://*) ;; *) echo "::error::l'adresse de vérification doit commencer par https://"; exit 1 ;; esac
        [[ "$GARDER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::garder doit être un nombre ≥ 1"; exit 1; }
        test -f "$SITE_CONSTRUIT/index.html" || { echo "::error::pas de site construit dans $SITE_CONSTRUIT"; exit 1; }
        n=$(find "$SITE_CONSTRUIT" -name index.html | wc -l)
        echo "Site à envoyer : $n pages."

    - name: Préparer la connexion
      shell: bash
      env:
        CLE: ${{ inputs.cle }}
        EMPREINTE: ${{ inputs.empreinte }}
      run: |
        set -eu
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        # Nettoyer la clé collée : retours à la ligne Windows, espaces en tête/fin.
        printf '%s\n' "$CLE" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > ~/.ssh/envoi
        chmod 600 ~/.ssh/envoi
        # Contrôler la clé AVANT de se connecter, sans jamais l'afficher.
        if grep -q '^ssh-' ~/.ssh/envoi; then
          echo "::error title=Clé d'envoi::le secret VPS_CLE_SSH contient la clé PUBLIQUE (elle commence par « ssh-ed25519 »). Il faut la clé PRIVÉE : le fichier du même nom SANS « .pub »."; exit 1
        fi
        if ! head -1 ~/.ssh/envoi | grep -q '^-----BEGIN .*PRIVATE KEY-----$' || ! tail -1 ~/.ssh/envoi | grep -q '^-----END .*PRIVATE KEY-----$'; then
          echo "::error title=Clé d'envoi::le secret VPS_CLE_SSH doit commencer par la ligne « -----BEGIN OPENSSH PRIVATE KEY----- » et finir par « -----END OPENSSH PRIVATE KEY----- », ces deux lignes comprises."; exit 1
        fi
        if ! ssh-keygen -y -P '' -f ~/.ssh/envoi >/dev/null 2>&1; then
          echo "::error title=Clé d'envoi::la clé privée est illisible : soit elle est protégée par une phrase de passe (il la faut SANS), soit elle a été abîmée au copier-coller (recoller le fichier entier)."; exit 1
        fi
        echo "Clé d'envoi lisible : $(ssh-keygen -l -f ~/.ssh/envoi | awk '{print $2}')"
        printf '%s\n' "$EMPREINTE" > ~/.ssh/known_hosts_envoi

    - name: Envoyer, basculer, vérifier
      shell: bash
      env:
        HOTE: ${{ inputs.hote }}
        PORT: ${{ inputs.port }}
        UTIL: ${{ inputs.utilisateur }}
        ADRESSE: ${{ inputs.adresse }}
        SITE_CONSTRUIT: ${{ inputs.site-construit }}
        GARDER: ${{ inputs.garder }}
      run: bash "$GITHUB_ACTION_PATH/envoyer.sh"

    - name: Effacer la clé
      if: always()
      shell: bash
      run: rm -f ~/.ssh/envoi ~/.ssh/known_hosts_envoi
