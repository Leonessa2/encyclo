# Moteur commun — fichier : moteur/envoi/nginx-site.conf   (version 0.2.0)
#
# La configuration nginx qui SERT un site statique construit par le moteur.
# Elle ne connaît aucun site : le dossier servi est toujours /srv/site/courant
# (un lien vers la dernière version envoyée, voir moteur/envoi/LISEZMOI.md).
# Elle traduit moteur/envoi/regles.json ; le banc moteur/bancs/envoi.mjs la fait
# tourner pour de vrai et vérifie chaque adresse du site construit.
#
# À poser tel quel dans /etc/nginx/conf.d/default.conf d'un conteneur nginx
# officiel (le fichier nginx.conf principal du conteneur fournit les types MIME).
#
# Différences voulues avec l'ancienne configuration (mesurées le 26/11/2026) :
#   · redirection « /dossier » -> « /dossier/ » RELATIVE (avant : vers http://,
#     d'où un détour de plus par Cloudflare) ;
#   · un seul Cache-Control sur les fichiers statiques (avant : deux, dont un
#     venu de `expires`) ;
#   · un dossier sans page répond 404, plus 403 ;
#   · en-têtes de sécurité sur TOUTES les réponses, erreurs comprises (`always`).
#
# ⚠️ `add_header` ne s'hérite pas d'un bloc à l'autre dès qu'un bloc en déclare
#    un : les trois en-têtes de sécurité sont donc répétés dans chaque bloc.

server {
  listen 80 default_server;
  server_name _;
  root /srv/site/courant;
  index index.html;
  charset utf-8;
  absolute_redirect off;
  server_tokens off;
  autoindex off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain
             application/xml application/xml+rss text/xml;

  error_page 404 /404.html;
  error_page 403 =404 /404.html;
  error_page 500 502 503 504 /500.html;

  # Pages, flux, et tout ce qui n'a pas de règle plus précise.
  location / {
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Les pages d'erreur : jamais gardées longtemps en cache.
  location = /404.html {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
  location = /500.html {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Fichiers statiques : 30 jours.
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|avif|woff2)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Plan du site, robots, index de recherche : une heure.
  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
  location = /search-index.json {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Jamais servis : le fichier de règles des autres hébergeurs, et tout
  # fichier ou dossier caché (commençant par un point).
  location = /_headers { return 404; }
  location ~ /\. { return 404; }
}
