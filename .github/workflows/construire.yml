# Dépôt : Leonessa2/encyclo — fichier : .github/workflows/construire.yml
#
# LOT 1 (26/11/2026) : construire le wiki en fichiers statiques, rien de plus.
# LOT 2 (26/11/2026) : se lance aussi après chaque lecture du Sheet.
# - Aucune mise en ligne : le résultat est seulement joint à l'exécution
#   (onglet Actions > l'exécution > « site-construit ») pour être comparé
#   au site actuel.
# - Recette reprise telle quelle du Dockerfile de Leonessa2/veve-sites
#   (étapes « build » et « marquer:i18n »), avec SITE=vevewiki.
# LOT 3 (26/11/2026) :
# - données du scrapeur téléchargées dans .donnees/ par
#   moteur/donnees/telecharger.sh ; si le scrapeur ne publie plus, on garde la
#   dernière bonne copie (cache GitHub) avec sa vraie date, sans échec ;
# - bancs retenus pour le wiki (outils/bancs.sh), avant et après construction.
# LOT 4 (26/11/2026) :
# - règles de service (en-têtes, cache, 404/500) dans moteur/envoi/ ;
#   _headers copié dans le site ; bancs `envoi` et `envoi-essai` (nginx réel) ;
# - job « envoyer » (moteur/envoi/action.yml) : ÉTEINT tant que la variable du
#   dépôt ENVOI_VPS ne vaut pas « oui » (Settings > Secrets and variables >
#   Actions > Variables). Réglages attendus : voir moteur/envoi/LISEZMOI.md.
# ESSAI SÉPARÉ (27/11/2026, accord de Preda) — deux cibles :
# - ESSAI (essai.vevewiki.com, clé VPS_CLE_SSH_ESSAI, dossier d'essai
#   seulement) : tout dépôt sur main et tout lancement à la main.
# - VRAI SITE (vevewiki.com, clé VPS_CLE_SSH) :
#   · la branche « en-ligne », avancée après le go de Preda (son commit doit
#     être sur main) : le code de « en-ligne » ;
#   · chaque lecture du Sheet réussie : le code de « en-ligne » + les textes
#     du Sheet les plus récents (seulement sites/vevewiki/editorial,
#     public/og/vevewiki, engine/data/lastmod) : les textes ne restent pas
#     bloqués, le code non validé ne part pas ;
#   · sans branche « en-ligne » : la lecture du Sheet ne part que sur l'essai.
#   (Branche et non étiquette : les étiquettes ne passent pas, RESEAU v3.21.)

name: Construire le wiki

on:
  push:
    branches: [main, en-ligne]
  workflow_dispatch:
    inputs:
      simuler_panne:
        description: "Simuler un scrapeur qui ne publie plus (contre-épreuve)"
        type: boolean
        default: false
  # Après chaque lecture du Sheet réussie (lot 2) : un dépôt fait par le robot
  # de GitHub ne relance pas ce workflow tout seul.
  workflow_run:
    workflows: [Lire le Sheet]
    types: [completed]

permissions:
  contents: read

# ⚠️ Pas d'annulation en cours de route (lot 4) : une exécution coupée pendant
#    l'envoi au VPS finirait en « cancelled », un état qui ne prévient personne.
#    La suivante attend la fin de celle-ci.
concurrency:
  group: construire
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      cible: ${{ steps.cible.outputs.cible }}
      code: ${{ steps.cible.outputs.code }}
    env:
      SITE: vevewiki
      SITE_URL: https://vevewiki.com
      RENDERING: static
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Avant tout le reste : la cible décide du code construit.
      - name: Choisir la cible (essai ou vrai site) et le code
        id: cible
        env:
          EVENEMENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: outils/choisir_cible.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer
        run: npm ci --no-audit --no-fund

      - name: Bancs avant construction
        run: outils/bancs.sh avant

      - name: Reprendre la dernière bonne copie des données
        uses: actions/cache/restore@v4
        with:
          path: .donnees
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-

      - name: Télécharger les données du scrapeur
        id: donnees
        env:
          DONNEES_PANNE: ${{ inputs.simuler_panne && '1' || '0' }}
        run: moteur/donnees/telecharger.sh

      - name: Garder cette copie pour la prochaine fois
        if: steps.donnees.outputs.rafraichi == 'true'
        uses: actions/cache/save@v4
        with:
          path: .donnees
          key: donnees-${{ github.run_id }}

      - name: Construire
        run: I18N_MARQUAGE=1 npm run build

      - name: Marquer les textes traduisibles
        run: npm run marquer:i18n

      - name: Préparer le service (règles pour les hébergeurs de fichiers)
        run: cp moteur/envoi/_headers dist/_headers

      - name: Préparer les bancs d'envoi (image nginx figée du VPS, rsync)
        timeout-minutes: 5
        run: |
          command -v rsync >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q rsync; }
          docker pull -q "$(tr -d '[:space:]' < moteur/envoi/image-nginx.txt)"

      - name: Bancs sur le site construit
        run: outils/bancs.sh apres

      - name: Contrôler le résultat
        run: |
          set -e
          test -f dist/index.html || { echo "ERREUR : pas de page d'accueil (dist/index.html)"; exit 1; }
          test ! -d dist/server || { echo "ERREUR : un dossier serveur existe, le site n'est pas statique"; exit 1; }
          test -f dist/404.html || { echo "ERREUR : pas de page 404"; exit 1; }
          n=$(find dist -name index.html | wc -l)
          echo "Pages construites : $n"
          [ "$n" -ge 250 ] || { echo "ERREUR : trop peu de pages ($n)"; exit 1; }

      - name: Joindre le site construit
        uses: actions/upload-artifact@v4
        with:
          name: site-construit
          path: dist/
          retention-days: 14

  # ═══ ENVOI AU VPS — ÉTEINT tant que ENVOI_VPS ≠ « oui » (lot 4, 26/11/2026) ═══
  # Envoie le site construit au VPS, bascule d'un coup, vérifie la page servie,
  # revient en arrière sinon (moteur/envoi/action.yml). Ne touche pas au domaine
  # du site : le domaine ne pointe vers ces fichiers que le jour de la bascule.
  envoyer:
    needs: construire
    if: >-
      vars.ENVOI_VPS == 'oui'
      && (needs.construire.outputs.cible == 'essai' || needs.construire.outputs.cible == 'vrai')
      && !(github.event_name == 'workflow_dispatch' && inputs.simuler_panne)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # L'action d'envoi est prise dans le code construit (branche en-ligne
      # pour le vrai site), pas forcément dans le dernier main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.construire.outputs.code }}

      - name: Reprendre le site construit
        uses: actions/download-artifact@v4
        with:
          name: site-construit
          path: dist

      # Deux étapes séparées (pas de « a && b || c ») : un secret vide ne peut
      # jamais faire passer une cible sur la clé de l'autre.
      - name: Envoyer sur l'ESSAI (essai.vevewiki.com)
        if: needs.construire.outputs.cible == 'essai'
        uses: ./moteur/envoi
        with:
          site-construit: dist
          hote: ${{ vars.VPS_HOTE }}
          port: ${{ vars.VPS_PORT || '22' }}
          utilisateur: ${{ vars.VPS_UTILISATEUR }}
          empreinte: ${{ vars.VPS_EMPREINTE }}
          adresse: https://essai.vevewiki.com
          cle: ${{ secrets.VPS_CLE_SSH_ESSAI }}

      - name: Envoyer sur le VRAI SITE (vevewiki.com)
        if: needs.construire.outputs.cible == 'vrai'
        uses: ./moteur/envoi
        with:
          site-construit: dist
          hote: ${{ vars.VPS_HOTE }}
          port: ${{ vars.VPS_PORT || '22' }}
          utilisateur: ${{ vars.VPS_UTILISATEUR }}
          empreinte: ${{ vars.VPS_EMPREINTE }}
          adresse: https://vevewiki.com
          cle: ${{ secrets.VPS_CLE_SSH }}
